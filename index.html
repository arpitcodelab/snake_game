<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Snake Game</title>
  
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/hud.css">
  <link rel="stylesheet" href="css/settings.css">

  <link rel="stylesheet" href="css/mobile.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Outfit:wght@600;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <div class="game-card">
      <!-- Top Header matching snake-game.io & Google Snake -->
      <header class="game-header">
        <div class="header-left">
          <div class="header-stat">
            <span class="planet-icon" title="Score">🪐</span>
            <span id="score-display" class="header-score">0</span>
          </div>
          <div class="header-stat">
            <span class="trophy-sprite trophy-gold" title="Best Score"></span>
            <span id="high-score-display" class="header-score">0</span>
          </div>
        </div>
        <div class="header-right">
        </div>
      </header>

      <!-- Canvas Wrapper with Screens Overlaid -->
      <main class="canvas-wrapper">
        <div id="canvas-container">
          <!-- The Game Canvas -->
          <canvas id="game-canvas" width="660" height="592"></canvas>

          <!-- In-Game HUD overlay -->
          <div class="hud-overlay" id="hud-overlay" style="display: none;">
            <div class="hud-item">
              <span class="hud-icon planet-hud-icon">🪐</span>
              <span id="hud-score">0</span>
            </div>
            <div class="hud-actions">
              <button id="btn-pause-hud" class="hud-btn" title="Pause / Resume">⏸</button>
            </div>
            <div class="hud-item">
              <span class="hud-icon"><span class="trophy-sprite trophy-gold" style="transform: scale(0.8);"></span></span>
              <span id="hud-best">0</span>
            </div>
          </div>

          <!-- Screen: Start Overlay (Ready State) -->
          <div id="screen-start" class="screen active">
            <div class="start-card">

              <h1 class="start-heading">SNAKE GAME</h1>
              <p class="start-subtitle">
                <span class="trophy-sprite trophy-gold" style="transform: scale(0.85);"></span>
                HIGH SCORE: <strong id="start-highscore">0</strong>
              </p>
              <div class="start-actions">
                <button id="btn-play" class="btn-primary">PLAY GAME</button>
              </div>
            </div>
          </div>

          <!-- Screen: Game Over matching snake-game.io -->
          <div id="screen-gameover" class="screen hidden">
            <div class="gameover-card">
              <div class="gameover-header">
                <div id="go-trophy-badge" class="trophy-large gold" style="display: none;"></div>
                <h2 class="gameover-heading">SNAKE GAME</h2>
              </div>
              <div class="score-summary">
                <div class="score-row">
                  <div class="score-label">
                    <span class="planet-icon" style="font-size: 1.2rem;">🪐</span>
                    <span>Score</span>
                  </div>
                  <span id="go-score" class="value">0</span>
                </div>
                <div class="score-row">
                  <div class="score-label">
                    <span class="trophy-sprite trophy-gold" style="transform: scale(0.85);"></span>
                    <span>Best</span>
                  </div>
                  <span id="go-best" class="value">0</span>
                </div>
              </div>
              <span id="go-new-high-badge" class="badge-new-high" style="display: none;">NEW HIGH SCORE! 🎉</span>

              <div class="gameover-actions">
                <button id="btn-replay" class="btn-primary">
                  <img src="assets/images/refresh_white_24dp.png" alt="Replay" class="btn-icon-img" />
                  PLAY AGAIN
                </button>
              </div>
            </div>
          </div>

          <!-- Panel: Settings Modal -->
          <div id="panel-settings" class="panel hidden">
            <div class="settings-card">
              <div class="settings-header">
                <h3 class="settings-title">⚙️ Game Settings</h3>
                <button id="btn-close-settings" class="btn-close">&times;</button>
              </div>
              <div class="setting-group">
                <label for="setting-game-mode" class="setting-label">GAME MODE</label>
                <select id="setting-game-mode" class="setting-select"></select>
              </div>
              <div class="setting-group">
                <label for="setting-board-size" class="setting-label">BOARD SIZE</label>
                <select id="setting-board-size" class="setting-select"></select>
              </div>
              <div class="setting-group">
                <label for="setting-fruits-count" class="setting-label">FRUITS ON SCREEN</label>
                <select id="setting-fruits-count" class="setting-select"></select>
              </div>
              <div class="setting-group">
                <label for="setting-theme" class="setting-label">BOARD THEME</label>
                <select id="setting-theme" class="setting-select"></select>
              </div>
              <div class="setting-group">
                <label for="setting-skin" class="setting-label">SNAKE SKIN</label>
                <select id="setting-skin" class="setting-select"></select>
              </div>
              <div class="setting-group">
                <label for="setting-quality" class="setting-label">GRAPHICAL QUALITY</label>
                <select id="setting-quality" class="setting-select">
                  <option value="auto">⚡ Auto (Adaptive)</option>
                  <option value="high">💎 High (Full FX)</option>
                  <option value="medium">⚖️ Medium (Balanced)</option>
                  <option value="low">🚀 Low (Performance)</option>
                </select>
              </div>
            </div>
          </div>


        </div>
      </main>
    </div>

    <!-- Mobile Swipe Hint (replaces D-Pad) -->
    <div class="swipe-hint" id="swipe-hint">
      <span class="swipe-hint-text">⟵ Swipe to move · Tap to pause ⟶</span>
    </div>

    <!-- Desktop Keyboard Guide Footer -->
    <footer class="game-footer">
      <div class="controls-hint">
        <span>Move: <strong>↑ ↓ ← →</strong> / <strong>W A S D</strong></span>
        <span class="separator">•</span>
        <span>Pause: <strong>Space</strong> / <strong>P</strong></span>
        <span class="separator">•</span>
        <span>Restart: <strong>R</strong></span>
      </div>
    </footer>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
