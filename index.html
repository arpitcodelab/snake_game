<!DOCTYPE html>
<html lang="en" data-theme="classic">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🐍 Modern Snake Game</title>
  
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/screens.css">
  <link rel="stylesheet" href="css/hud.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/mobile.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&family=Outfit:wght@500;700;900&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Top Header -->
    <header class="game-header">
      <div class="logo">
        <span class="snake-emoji">🐍</span>
        <span class="game-title">SNAKE</span>
      </div>
      <div class="quick-stats">
        <div class="stat-box">
          <span class="stat-label">SCORE</span>
          <span id="score-display" class="stat-value">0</span>
        </div>
        <div class="stat-box">
          <span class="stat-label">BEST</span>
          <span id="high-score-display" class="stat-value">0</span>
        </div>
      </div>
    </header>

    <!-- Canvas Wrapper with Screens Overlaid -->
    <main class="canvas-wrapper">
      <div id="canvas-container">
        <!-- The Game Canvas -->
        <canvas id="game-canvas" width="600" height="600"></canvas>

        <!-- In-Game HUD overlay -->
        <div class="hud-overlay" id="hud-overlay">
          <div class="hud-item">
            <span class="hud-icon">🍎</span>
            <span id="hud-score">0</span>
          </div>
          <button id="btn-pause-hud" class="hud-btn" title="Pause / Resume">⏸</button>
          <div class="hud-item">
            <span class="hud-icon">🏆</span>
            <span id="hud-best">0</span>
          </div>
        </div>

        <!-- Screen: Start -->
        <div id="screen-start" class="screen active">
          <div class="start-title-container">
            <div class="start-logo">🐍</div>
            <h1 class="start-heading">SNAKE</h1>
            <p class="start-subtitle">High Score: <strong id="start-highscore">0</strong></p>
          </div>
          <div class="start-actions">
            <button id="btn-play" class="btn-primary">PLAY NOW</button>
            <button id="btn-settings-start" class="btn-secondary">⚙️ SETTINGS</button>
          </div>
        </div>

        <!-- Screen: Game Over -->
        <div id="screen-gameover" class="screen hidden">
          <h2 class="gameover-heading">GAME OVER</h2>
          <div class="gameover-card">
            <div class="score-row">
              <span>Score</span>
              <span id="go-score" class="value">0</span>
            </div>
            <div class="score-row">
              <span>Best</span>
              <span id="go-best" class="value">0</span>
            </div>
            <span id="go-new-high-badge" class="badge-new-high" style="display: none;">NEW HIGH SCORE! 🎉</span>
          </div>
          <div class="start-actions">
            <button id="btn-replay" class="btn-primary">PLAY AGAIN</button>
            <button id="btn-menu" class="btn-secondary">MAIN MENU</button>
          </div>
        </div>

        <!-- Panel: Settings Modal -->
        <div id="panel-settings" class="panel hidden">
          <div class="settings-card">
            <div class="settings-header">
              <h3 class="settings-title">⚙️ Game Settings</h3>
              <button id="btn-close-settings" class="btn-close">&times;</button>
            </div>
            <div class="setting-group">
              <label for="setting-game-mode" class="setting-label">GAME MODE</label>
              <select id="setting-game-mode" class="setting-select"></select>
            </div>
            <div class="setting-group">
              <label for="setting-board-size" class="setting-label">BOARD SIZE</label>
              <select id="setting-board-size" class="setting-select"></select>
            </div>
            <div class="setting-group">
              <label for="setting-fruits-count" class="setting-label">FRUITS ON SCREEN</label>
              <select id="setting-fruits-count" class="setting-select"></select>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Mobile On-Screen D-Pad -->
    <div id="mobile-controls">
      <div class="dpad">
        <button class="dpad-btn" data-dir="up" aria-label="Up">▲</button>
        <div class="dpad-row">
          <button class="dpad-btn" data-dir="left" aria-label="Left">◀</button>
          <button class="dpad-btn" data-dir="right" aria-label="Right">▶</button>
        </div>
        <button class="dpad-btn" data-dir="down" aria-label="Down">▼</button>
      </div>
    </div>

    <!-- Desktop Keyboard Guide Footer -->
    <footer class="game-footer">
      <div class="controls-hint">
        <span>Move: <strong>↑ ↓ ← →</strong> / <strong>W A S D</strong></span>
        <span class="separator">•</span>
        <span>Pause: <strong>Space</strong> / <strong>P</strong></span>
        <span class="separator">•</span>
        <span>Restart: <strong>R</strong></span>
      </div>
    </footer>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
